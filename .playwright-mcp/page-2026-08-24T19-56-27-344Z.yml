      - generic [ref=f29e370]:
        - heading "Free Stock Market API and Financial Statements API" [level=1] [ref=f29e371]
        - paragraph [ref=f29e372]: FMP is your source for the most reliable and accurate Stock Market API and Financial Data API available. Whether you're looking for real-time stock prices, financial statements, or historical data, we offer a comprehensive solution to meet all your financial data needs.
        - paragraph [ref=f29e373]: Our platform provides free stock market data, including audited, standardized, and real-time updates of income statements, balance sheets, and cash flow statements on a quarterly and annual basis.
        - paragraph [ref=f29e374]: We also offer a wide range of historical stock prices, from 1 minute, 15 minutes, 30 minutes, 1 hour and daily intervals, ensuring you have the data you need.
        - heading "Authorization" [level=4] [ref=f29e375]
        - paragraph [ref=f29e376]: All API requests must be authorized using an API key. Authorization can be done using either request headers or URL query parameters.
        - paragraph [ref=f29e377]: Header Authorization
        - paragraph [ref=f29e379]: "Include your API key in the request header as: apikey: YOUR_API_KEY"
        - paragraph [ref=f29e380]: URL Query Authorization
        - paragraph [ref=f29e382]: To authorize your requests, append ?apikey=YOUR_API_KEY at the end of every request.
        - paragraph [ref=f29e383]:
          - generic [ref=f29e384]: "Note: When adding the API key to your requests, ensure to use &apikey= if other query parameters already exist in the endpoint."
