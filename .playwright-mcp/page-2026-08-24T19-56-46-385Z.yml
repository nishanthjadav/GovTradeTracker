        - heading "Senate Trading Activity API" [level=1] [ref=f33e157]
        - paragraph [ref=f33e158]: Monitor the trading activity of US Senators with the FMP Senate Trading Activity API. Access detailed information on trades made by Senators, including trade dates, assets, amounts, and potential conflicts of interest.
        - button "Explore Endpoint" [ref=f33e160] [cursor=pointer]
      - generic [ref=f33e161]:
        - heading "About Senate Trading Activity API" [level=2] [ref=f33e162]
        - generic [ref=f33e163]:
          - paragraph [ref=f33e164]: "The FMP Senate Trading Activity API provides comprehensive data on the trading activities of US Senators, as required by the STOCK Act of 2012. This API is essential for:"
          - list [ref=f33e165]:
            - listitem [ref=f33e166]:
              - strong [ref=f33e167]: Transparency & Accountability
              - text: ": Access a detailed list of trades made by US Senators, including the date, asset, amount traded, and price per share. This transparency helps ensure accountability and provides insights into the financial activities of elected officials."
            - listitem [ref=f33e168]:
              - strong [ref=f33e169]: Conflict of Interest Identification
              - text: ": Use the data to identify potential conflicts of interest by analyzing trades made by Senators in companies or sectors where they may have legislative influence. This information is crucial for investors who want to ensure ethical investment practices."
            - listitem [ref=f33e170]:
              - strong [ref=f33e171]: Informed Investment Decisions
              - text: ": Investors can track the trading activities of Senators to gain insights into market trends or to flag any trades that might indicate a significant market move. Knowing when and what Senators are trading can provide a unique perspective on market sentiment."
          - paragraph [ref=f33e172]: This API is a powerful tool for investors, analysts, and anyone interested in monitoring the financial activities of US Senators and ensuring transparency in government.
          - paragraph [ref=f33e173]: "Example Use CaseEthical Investing: An investor focused on ethical investing might use the Senate Trading Activity API to avoid investing in companies where Senators have made trades, especially if those trades could be seen as conflicts of interest. By doing so, the investor aligns their portfolio with ethical standards."
