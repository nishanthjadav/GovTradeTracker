name: Daily trade scrape

on:
  schedule:
    - cron: "17 10 * * *"   # 10:17 UTC daily
  workflow_dispatch:         # allow manual trigger from Actions tab

concurrency:
  group: trade-scrape
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ml/scraper/requirements.txt

      - name: Install dependencies
        run: pip install -r ml/scraper/requirements.txt

      - name: Scrape and push
        env:
          BACKEND_URL:    ${{ secrets.BACKEND_URL }}
          INGEST_SECRET:  ${{ secrets.INGEST_SECRET }}
        run: python -m ml.scraper.scrape_and_push
