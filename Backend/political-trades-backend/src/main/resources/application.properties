spring.application.name=politicaltrades
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/politicaltrades}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# --- Logging ---
logging.level.com.yourapp.politiciantracker=INFO

# --- Alpaca (per-user keys preferred; these are a fallback for unlinked users) ---
alpaca.api.key=${ALPACA_API_KEY:}
alpaca.api.secret=${ALPACA_API_SECRET:}
alpaca.base.url=https://paper-api.alpaca.markets/v2

# --- App config ---
app.secret.key=${APP_SECRET_KEY}
app.frontend.url=${FRONTEND_URL:http://localhost:5173}
app.admin.email=${ADMIN_EMAIL:nishanthjadav@gmail.com}
app.ingest.secret=${INGEST_SECRET:}

# --- Google OAuth2 ---
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# --- Session cookie ---
# SameSite=None is required because frontend (Vercel) and backend (Render) are
# on different registrable domains in prod. CSRF defense is enforced via the
# X-Requested-With header check in CsrfHeaderFilter — browsers will only send
# that custom header after a successful CORS preflight against our allowed
# origin, so cross-site attacker pages can't forge it.
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true
