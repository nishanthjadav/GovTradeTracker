    - generic [ref=f6e9767]:
      - generic [ref=f6e9769]:
        - heading "Company Earnings Quality Score Premium" [level=2] [ref=f6e9770]
        - paragraph [ref=f6e9771]:
          - paragraph [ref=f6e9772]: This endpoint provides Earnings Quality Score for global companies.
          - paragraph [ref=f6e9773]: Earnings quality refers to the extent to which current earnings predict future earnings. "High-quality" earnings are expected to persist, while "low-quality" earnings do not. A higher score means a higher earnings quality
          - paragraph [ref=f6e9774]: "Finnhub uses a proprietary model which takes into consideration 4 criteria:"
          - list [ref=f6e9775]:
            - listitem [ref=f6e9776]: Profitability
            - listitem [ref=f6e9777]: Growth
            - listitem [ref=f6e9778]: Cash Generation & Capital Allocation
            - listitem [ref=f6e9779]: Leverage
          - paragraph [ref=f6e9780]: We then compare the metrics of each company in each category against its peers in the same industry to gauge how quality its earnings is.
        - paragraph [ref=f6e9781]:
          - text: "Method:"
          - code [ref=f6e9782]: GET
        - paragraph [ref=f6e9783]: "Premium: Premium Access Required"
