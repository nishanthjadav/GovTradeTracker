      - generic [ref=f33e291]:
        - heading "Senate Trading Activity API FAQs" [level=3] [ref=f33e292]
        - generic [ref=f33e293]:
          - paragraph [ref=f33e294] [cursor=pointer]: +How is industry value calculated in the Industry Performance Summary API?
          - paragraph: Industry value reflects the total financial worth of companies operating within a particular industry sector.
        - generic [ref=f33e295]:
          - paragraph [ref=f33e296] [cursor=pointer]: +What information does the Industry Performance Summary API provide?
          - paragraph: It provides a summary of the financial performance of various industries, including industry titles and total industry value for a specified period.
        - generic [ref=f33e297]:
          - paragraph [ref=f33e298] [cursor=pointer]: +Is the Industry Performance Summary data provided in real-time?
          - paragraph: No, the data is based on quarterly filings and is updated in accordance with those periods.
        - generic [ref=f33e299]:
          - paragraph [ref=f33e300] [cursor=pointer]: +Can I track industry performance over multiple quarters using the Industry Performance Summary API?
          - paragraph: Yes, you can retrieve data for multiple quarters to track industry trends over time.
        - generic [ref=f33e301]:
          - paragraph [ref=f33e302] [cursor=pointer]: +Does the Industry Performance Summary API cover all industries?
          - paragraph: The API provides performance data for a wide range of industries, as defined by the institutional reports.
        - generic [ref=f33e303]:
          - paragraph [ref=f33e304] [cursor=pointer]: +Can I use this API to compare different industries?
          - paragraph: Yes, the API allows you to compare performance metrics between different industries to identify trends and opportunities.
        - generic [ref=f33e305]:
          - paragraph [ref=f33e306] [cursor=pointer]: +How can the Industry Performance Summary API help in portfolio management?
          - paragraph: By understanding which industries are performing well, you can make informed decisions about which sectors to invest in or reduce exposure to.
