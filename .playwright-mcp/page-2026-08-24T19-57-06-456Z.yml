        - text: ". Displaying or redistributing data sourced from FMP requires a specific Data Display and Licensing Agreement with FMP. API usage has a trailing 30 days bandwidth limit of: Free plan - 500MB, Starter plan - 20GB, Premium plan - 50GB, Ultimate plan - 150GB, Build plan - 100GB, and Enterprise plan 1TB+. The financial information and data provided are intended solely for informational purposes and should not be considered as advice or recommendations for trading, investment, legal, tax, accounting, or other professional services. Users access and utilize this data at their own risk. While FMP employs a robust data extraction and manual review process to maintain accuracy, errors or omissions may occur. FMP disclaims any liability for inaccuracies or errors in the provided data."
