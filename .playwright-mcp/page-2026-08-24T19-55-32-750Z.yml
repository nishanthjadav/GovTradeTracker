    - generic [ref=f6e9415]:
      - generic [ref=f6e9417]:
        - heading "Investment Themes (Thematic Investing) Premium" [level=2] [ref=f6e9418]
        - paragraph [ref=f6e9419]:
          - paragraph [ref=f6e9420]: Thematic investing involves creating a portfolio (or portion of a portfolio) by gathering together a collection of companies involved in certain areas that you predict will generate above-market returns over the long term. Themes can be based on a concept such as ageing populations or a sub-sector such as robotics, and drones. Thematic investing focuses on predicted long-term trends rather than specific companies or sectors, enabling investors to access structural, one-off shifts that can change an entire industry.
          - paragraph [ref=f6e9421]: This endpoint will help you get portfolios of different investment themes that are changing our life and are the way of the future.
          - paragraph [ref=f6e9422]:
            - text: A full list of themes supported can be found
            - link "here" [ref=f6e9423] [cursor=pointer]:
              - /url: https://docs.google.com/spreadsheets/d/1ULj9xDh4iPoQj279M084adZ2_S852ttRthKKJ7madYc/edit?usp=sharing
            - text: . The theme coverage and portfolios are updated bi-weekly by our analysts. Our approach excludes penny, super-small cap and illiquid stocks.
        - paragraph [ref=f6e9424]:
